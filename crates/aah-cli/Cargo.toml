[package]
name = "aah-cli"
version = "0.1.3"
edition = "2021"

[[bin]]
name = "aah"
path = "src/main.rs"

[dependencies]
aah-core = { path = "../aah-core" }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.29"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
